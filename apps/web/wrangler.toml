name = "market-insights-web"
main = "build/worker/shim.mjs"
compatibility_date = "2025-11-11"

[build]
command = "cargo leptos build --release && cargo install -q worker-build && LEPTOS_OUTPUT_NAME=web worker-build --release --features ssr"

[assets]
directory = "./target/site"

# 🔔 Cron (optional)
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "47367d042d3d4741a464728ec78efd98"
preview_id = "05959142026b4eec8619a98399bc2ce3"

[[d1_databases]]
binding = "market_insights"
database_name = "market-insights"
database_id = "5470ceac-2c76-46d1-8aee-d4a4b9868e01"
migrations_dir = "./migrations"